services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      PORT: "4000"
      NODE_ENV: production
      RAG_URL: http://host.docker.internal:8001
    depends_on:
      database:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    restart: unless-stopped

  # Host networking gives this Linux service direct access to:
  # local Ollama at 127.0.0.1:11434.
  rag:
    build: ./rag
    network_mode: host
    env_file:
      - .env
    environment:
      PRODUCT_API_URL: http://127.0.0.1:4000/api/products
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      CHROMA_PATH: /data/chroma
    volumes:
      - rag_chroma_data:/data/chroma
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL}"
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
  rag_chroma_data:
